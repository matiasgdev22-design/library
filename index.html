
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dev Library</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header class="header">

    <div class="logo">
      <h1>Dev<span>Library</span></h1>
      <p>Tu espacio personal de lectura</p>
    </div>

    <button id="new-book-btn">+ Nuevo libro</button>

  </header>

  <main class="main-container">

    <section class="welcome">
      <h2>Mi biblioteca</h2>
      <p>Organizá tus lecturas y seguí aprendiendo.</p>
    </section>

    <section class="stats">

      <div class="stat-card">
        <h3>Total de libros</h3>
        <p id="total-books">0</p>
      </div>

      <div class="stat-card">
        <h3>Pendientes</h3>
        <p id="pending-books">0</p>
      </div>

      <div class="stat-card">
        <h3>Leyendo</h3>
        <p id="reading-books">0</p>
      </div>

      <div class="stat-card">
        <h3>Terminados</h3>
        <p id="finished-books">0</p>
      </div>

    </section>

    
<section class="add-book-section">

  <form id="book-form" class="book-form" hidden>

    <h2>Agregar un libro</h2>
    <div class="form-group">
  <label for="cover">URL de la portada (opcional)</label>
  <input
    type="url"
    id="cover"
    placeholder="https://ejemplo.com/portada.jpg"
  >
</div>

<div class="form-group">
  <label for="notes">Mis notas</label>
  <textarea
    id="notes"
    rows="4"
    placeholder="Escribí tus ideas, conceptos y aprendizajes..."
  ></textarea>
</div>

    <div class="form-group">
      <label for="title">Título</label>
      <input type="text" id="title" 
      placeholder="Ej: Eloquent JavaScript" required>
    </div>

    <div class="form-group">
      <label for="author">Autor</label>
      <input type="text" id="author"
        placeholder="Nombre del autor" required>
    </div>

    <div class="form-group">
      <label for="pages">Cantidad de páginas</label>
      <input type="number" id="pages" min="1" placeholder="Ej: 350" required>
    </div>

    <div class="form-group">
      <label for="category">Categoría</label>
      <select id="category" required>
        <option value="">Seleccionar categoría</option>
        <option value="Programación">Programación</option>
        <option value="JavaScript">JavaScript</option>
        <option value="HTML y CSS">HTML y CSS</option>
        <option value="Algoritmos">Algoritmos</option>
        <option value="Python">Python</option>
        <option value="Bases de datos">Bases de datos</option>
        <option value="Literatura">Literatura</option>
        <option value="Otros">Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status">Estado de lectura</label>
      <select id="status">
        <option value="pending">Pendiente</option>
        <option value="reading">Leyendo</option>
        <option value="finished">Terminado</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit">Guardar libro</button>
      <button type="button" id="cancel-btn">Cancelar</button>
    </div>

  </form>

</section>


    <section class="library-section">

      <div class="library-header">
        <h2>Mis libros</h2>

        <input
          type="search"
          id="search-book"
          placeholder="Buscar un libro..."
        >
        <select id="category-filter">
        <option value="all">Todas las categorías</option>
        </select>
      </div>

      <div class="filters">

        <button class="filter-btn active" data-filter="all">
          Todos
        </button>

        <button class="filter-btn" data-filter="pending">
          Pendientes
        </button>

        <button class="filter-btn" data-filter="reading">
          Leyendo
        </button>

        <button class="filter-btn" data-filter="finished">
          Terminados
        </button>

      </div>

      <div id="library-container" class="library-grid">
        <!-- Aquí aparecerán las tarjetas -->
      </div>

    </section>

  </main>

</body>
</html>
